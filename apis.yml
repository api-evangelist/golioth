  - type: Examples
    url: examples/golioth-query-stream-example.json
- aid: golioth:rpc
  name: Golioth Remote Procedure Call (RPC)
  description: >-
    Bidirectional remote-procedure-call service. The cloud invokes device-side methods registered by firmware
    and receives the response, enabling on-demand diagnostics and control.
  humanURL: https://docs.golioth.io/device-management/rpc/
  baseURL: https://api.golioth.io
  tags:
  - RPC
  - Device Management
  - Control
  properties:
  - type: Documentation
    url: https://docs.golioth.io/device-management/rpc/
  - type: Examples
    url: examples/golioth-invoke-rpc-example.json
- aid: golioth:ota
  name: Golioth OTA Firmware Updates
  description: >-
    Over-the-air firmware update service. Upload artifacts, group them into releases, target devices by
    tag or blueprint, and roll out updates with progress tracking and rollback.
  humanURL: https://docs.golioth.io/device-management/ota/
  baseURL: https://api.golioth.io
  tags:
  - OTA
  - Firmware
  - Updates
  properties:
  - type: Documentation
    url: https://docs.golioth.io/device-management/ota/
