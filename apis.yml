apis:
- aid: golioth:lightdb-state
  name: Golioth LightDB State
  description: >-
    Per-device key/value state store. Devices and cloud services read and write structured state (JSON/CBOR)
    that is synchronized between device and cloud over CoAP.
  humanURL: https://docs.golioth.io/application-services/lightdb/
  baseURL: https://api.golioth.io
  tags:
  - LightDB
  - States
  - Device Data
  tags_raw:
  - LightDB
  - State
  - Device Data
  properties:
  - type: Documentation
    url: https://docs.golioth.io/application-services/lightdb/
- aid: golioth:lightdb-stream
  name: Golioth LightDB Stream
  description: >-
    Time-series ingest endpoint for streaming sensor and telemetry data from devices. Stored data can
    be queried and routed downstream via Pipelines.
  humanURL: https://docs.golioth.io/application-services/stream/
  baseURL: https://api.golioth.io
  tags:
  - Time Series
  - Telemetry
  - Stream
  properties:
