- aid: golioth:settings
  name: Golioth Device Settings
  description: >-
    Cloud-managed settings pushed to one device, a group, or an entire fleet. Firmware subscribes to settings
    keys and receives updates without requiring a firmware release.
  humanURL: https://docs.golioth.io/device-management/settings/
  baseURL: https://api.golioth.io
  tags:
  - Settings
  - Configuration
  - Fleet
  properties:
  - type: Documentation
    url: https://docs.golioth.io/device-management/settings/
- aid: golioth:logging
  name: Golioth Logging
  description: >-
    Centralized device logging. Firmware emits structured log lines that are collected, indexed, and made
    queryable via the console and API.
  humanURL: https://docs.golioth.io/device-management/logging/
  baseURL: https://api.golioth.io
  tags:
  - Logs
  - Observability
  properties:
  - type: Documentation
    url: https://docs.golioth.io/device-management/logging/
- aid: golioth:pipelines
  name: Golioth Pipelines
  description: >-
    Data routing and transformation engine. Pipelines describe how data arriving from devices is filtered,
    transformed, and forwarded to downstream destinations such as AWS S3, GCP Pub/Sub, Azure Event Hubs,
    InfluxDB, MongoDB, and generic webhooks.
  humanURL: https://docs.golioth.io/data-routing/
  baseURL: https://api.golioth.io
  tags:
  - Pipelines
  - Data Routing
  - Integration
  properties:
  - type: Documentation
    url: https://docs.golioth.io/data-routing/
  - type: Examples
    url: examples/golioth-create-pipeline-example.json
- aid: golioth:location
  name: Golioth Location
  description: >-
    Location service that resolves device position from cellular tower and Wi-Fi access-point observations
    submitted by firmware, returning latitude/longitude back to the device or downstream system.
  humanURL: https://docs.golioth.io/application-services/location/
  baseURL: https://api.golioth.io
  tags:
