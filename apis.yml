    url: https://docs.golioth.io/application-services/location/
- aid: golioth:firmware-sdk
  name: Golioth Firmware SDK
  description: >-
    Open-source firmware SDK that connects embedded devices to the Golioth cloud over CoAP. Supports Zephyr
    RTOS, nRF Connect SDK, ESP-IDF, and ModusToolbox. Implements client APIs for LightDB State, LightDB
    Stream, RPC, settings, logging, and OTA.
  humanURL: https://github.com/golioth/golioth-firmware-sdk
